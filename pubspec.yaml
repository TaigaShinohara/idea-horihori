name: horihori
description: "アイデアをストックして、AIの質問で企画メモに育てるアプリ（アイデアホリホリ）"
publish_to: 'none'
version: 0.4.0+9

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.3
  flutter_device_ai: ^0.3.0
  # Sign in with ChatGPT（OAuth+PKCE／トークンは端末内セキュア保存のみ）
  crypto: ^3.0.3
  flutter_secure_storage: ^9.2.4
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
